[www]
; Each chat request holds a worker while Claude answers, so keep enough workers for concurrent users.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
request_terminate_timeout = 200s
; Pass the container's environment (APP_KEY, MONGODB_URI, ...) to PHP.
clear_env = no
