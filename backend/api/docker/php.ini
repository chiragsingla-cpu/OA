; Uploads are validated at 10 MB in DocumentController; leave headroom for the multipart overhead.
upload_max_filesize = 12M
post_max_size = 13M
memory_limit = 256M
; Chat calls can wait on Claude for over a minute.
max_execution_time = 180
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
